    <script type="application/ld+json">
      {
        "@context": "http://schema.org",
        "@type": "Organization",
        "name": "ZetCollect",
        "url": "https://www.zetcollect.com",
        "logo": "%PUBLIC_URL%/favcon.ico",

        "description": "Empowering African microfinance institutions with efficient, transparent, and fraud-resistant digital collection solutions.",
        "contactPoint": {
          "@type": "ContactPoint",

          "email": "contact@zetcollect.com",
          "telephone": "+254 703 468 300"
        },
        "sameAs": [
          "https://www.linkedin.com/company/zetcollect",
          "https://www.youtube.com/@izsoftwares"
        ]
      }
      </script>


      <script type="text/javascript">
        (function(l) {
          if (l.search) {
            var q = {};
            l.search.slice(1).split('&').forEach(function(v) {
              var a = v.split('=');
              q[a[0]] = a.slice(1).join('=').replace(/~and~/g, '&');
            });
            if (q.p !== undefined) {
              window.history.replaceState(null, null,
                l.pathname.slice(0, -1) + (q.p || '') +
                (q.q ? ('?' + q.q) : '') +
                l.hash
              );
            }
          }
        }(window.location))
      </script>
    

    <title>ZetCollect</title>
